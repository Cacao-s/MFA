#
# The checks: everything `make check` runs, plus the three conformance suites
# that need a platform toolchain this repository's own machine does not have.
#
# ---------------------------------------------------------------------------
# THIS WORKFLOW ONLY RUNS WHEN YOU START IT.
#
# There is no `push` or `pull_request` trigger, by decision — not an
# oversight. Run it from the Actions tab ("Run workflow"), or:
#
#   gh workflow run checks.yml
#   gh workflow run checks.yml -f fuzz_seconds=300
#
# To have it run on its own later, uncomment the block below. `pull_request`
# is the one worth turning on first: it fires once per push to a pull request
# rather than once per push anywhere.
#
#   push:
#     branches: [main]
#   pull_request:
#     branches: [main]
# ---------------------------------------------------------------------------
#
# Only first-party `actions/*` actions are used here. Rust is already on the
# runners, and avoiding third-party actions means nothing outside GitHub and
# this repository gets to run code with a token in the environment. Dependabot
# keeps the ones that are used current (.github/dependabot.yml).
#
name: checks

on:
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: 'Seconds per fuzz target; 0 skips fuzzing entirely'
        required: false
        default: '0'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core — fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - run: rustup component add rustfmt clippy

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # --all-features pulls in `qr-image`, so the image decoders are covered.
      - run: cargo test --workspace --all-features

      - name: Check the MSRV the manifest claims
        run: |
          # rust-version is a promise. An unkept one surfaces as a build
          # failure on somebody else's machine.
          msrv=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "manifest says $msrv"
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" check --workspace --all-features

  conformance-dotnet:
    name: conformance — Windows implementation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # windows/MFA/Sync/HttpProvider.cs imports nothing but the base class
      # library, so the Windows implementation is checked on Linux. Only the
      # WinUI layer above it needs Windows.
      - run: dotnet test conformance/dotnet --verbosity normal

  conformance-android:
    name: conformance — Android implementation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # Robolectric, so no emulator. The Android SDK is already on the runner.
      #
      # This suite has never been run: it was written in a container with no
      # Android SDK. If it fails on wiring rather than on a real
      # disagreement, fix the wiring — see conformance/README.md.
      - name: Conformance suite
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests '*SyncProviderConformanceTest*'

      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

  conformance-apple:
    name: conformance — Apple implementation
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - run: brew install xcodegen

      # The target compiles only the two Sync sources that import nothing but
      # Foundation, so this needs neither the Rust XCFramework nor a signing
      # identity.
      #
      # Also never run before now: there is no Swift toolchain on the machine
      # it was written on.
      - name: Generate the project
        working-directory: apple
        run: xcodegen generate

      - name: Conformance suite
        working-directory: apple
        run: |
          xcodebuild test \
            -scheme MFAConformance \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

  fuzz:
    name: fuzz the parsers
    runs-on: ubuntu-latest
    if: inputs.fuzz_seconds != '0'
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            fuzz/target
          key: fuzz-${{ runner.os }}-${{ hashFiles('fuzz/Cargo.lock') }}
          restore-keys: fuzz-${{ runner.os }}-

      - name: Install the fuzzing toolchain
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked

      - name: Run every target
        working-directory: fuzz
        env:
          SECONDS_PER_TARGET: ${{ inputs.fuzz_seconds }}
        run: |
          for target in $(cargo +nightly fuzz list); do
            echo "::group::$target"
            cargo +nightly fuzz run "$target" -- \
              -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=4096
            echo "::endgroup::"
          done

      - name: Keep any crash it found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
