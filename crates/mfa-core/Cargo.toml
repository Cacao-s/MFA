[package]
name = "mfa-core"
description = "Platform-independent core for the MFA authenticator: TOTP, otpauth URIs, Google Authenticator migration, and the mergeable encrypted vault."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
argon2 = "0.5.3"
base64 = "0.23.1"
chacha20poly1305 = "0.10.1"
data-encoding = "2.11.1"
hmac = "0.12.1"
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg"], optional = true }
percent-encoding = "2.3.2"
rand_core = { version = "0.6", features = ["getrandom"] }
rqrr = { version = "0.10.1", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.10.7"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.21"
uuid = { version = "1.20.0", features = ["v4", "serde"] }
zeroize = { version = "1.8.2", features = ["zeroize_derive"] }

[features]
default = []
# Decode a QR code out of an image file / screen grab (desktop "add account from image").
qr-image = ["dep:rqrr", "dep:image"]

[dev-dependencies]
image = { version = "0.25.6", default-features = false, features = ["png"] }
qrcode = { version = "0.14.1", features = ["image"] }
