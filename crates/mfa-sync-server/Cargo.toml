[package]
name = "mfa-sync-server"
description = "Optional self-hosted sync server for MFA. Stores ciphertext and nothing else."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = "0.8.9"
data-encoding = "2.11.1"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "fs", "signal", "net", "io-util"] }
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
mfa-core = { path = "../mfa-core" }
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
