# XcodeGen spec. A .pbxproj is a generated blob nobody can review, so the
# project is described here instead:
#
#   brew install xcodegen
#   cd apple && xcodegen generate && open MFA.xcodeproj
#
# The Rust core has to be built first, because both targets link the
# XCFramework this produces:
#
#   ./scripts/build-apple.sh --release

name: MFA
options:
  bundleIdPrefix: com.zeyanlin
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: NKJSLB6HBR
    SWIFT_VERSION: "5.9"
    # Deliberately not `complete`: none of this has been through a compiler
    # yet, and strict concurrency diagnostics are the kind of thing to tighten
    # once it builds rather than to guess at. Raise it when it is green.
    SWIFT_STRICT_CONCURRENCY: minimal

packages: {}

targetTemplates:
  App:
    type: application
    sources:
      - path: Sources/App
      - path: Sources/Platform
      - path: Sources/Sync
      - path: Sources/Views
      # The generated Swift bindings are compiled into the app target rather
      # than imported as a module: UniFFI emits the error enum without
      # `public`, so from a separate module `MfaError` would be invisible and
      # nothing could read a failure's kind.
      - path: ../build/apple/Sources/MfaCore.swift
        optional: true
    dependencies:
      - framework: ../build/apple/MfaCoreFFI.xcframework
        embed: false

targets:
  MFA-iOS:
    templates: [App]
    platform: iOS
    sources:
      - path: Sources/iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeyanlin.mfa
        INFOPLIST_FILE: Resources/Info-iOS.plist
        TARGETED_DEVICE_FAMILY: "1,2"

  MFA-macOS:
    templates: [App]
    platform: macOS
    sources:
      - path: Sources/macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeyanlin.mfa
        INFOPLIST_FILE: Resources/Info-macOS.plist
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Resources/MFA-macOS.entitlements

  # The cross-language conformance suite: conformance/vectors/*.json, run
  # against the real HTTPProvider.
  #
  # Deliberately not part of either app target. It compiles the two Sync
  # sources that import nothing but Foundation, so it needs no XCFramework, no
  # signing identity and no device — which is what lets CI run it on a bare
  # checkout before anything else has been built.
  MFAConformance:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Sources/Sync/SyncProvider.swift
      - path: Sources/Sync/HTTPProvider.swift
      - path: Tests/Conformance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeyanlin.mfa.conformance
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""

schemes:
  MFAConformance:
    build:
      targets:
        MFAConformance: [test]
    test:
      targets: [MFAConformance]
