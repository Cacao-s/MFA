# Dependency updates, grouped so a week's worth arrives as a few pull requests
# rather than a dozen. Security updates are not grouped: those should be
# reviewable on their own.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]

  # The fuzz targets are their own workspace.
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5
    groups:
      android-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /windows
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5
    groups:
      windows-minor-and-patch:
        update-types: [minor, patch]
