[workspace]
resolver = "2"
members = ["crates/mfa-core", "crates/mfa-ffi", "crates/mfa-sync-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/cacao-s/mfa"

[profile.release]
lto = true
codegen-units = 1
strip = true
