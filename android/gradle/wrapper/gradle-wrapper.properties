# Pins the Gradle that builds this project. AGP 8.7.3 needs 8.9 or newer.
#
# `distributionSha256Sum` is NOT set, and should be. It makes the wrapper
# refuse a distribution that is not byte-for-byte the expected one, which is
# the whole supply-chain value of pinning a version. It was left out because
# the host serving the checksums is not reachable from the container this was
# generated in. To add it:
#
#   curl -L https://services.gradle.org/distributions/gradle-8.11.1-bin.zip.sha256
#
# then put the value on a `distributionSha256Sum=` line below, or regenerate
# the wrapper with:
#
#   gradle wrapper --gradle-version 8.11.1 \
#     --gradle-distribution-sha256-sum <the checksum>
#
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
